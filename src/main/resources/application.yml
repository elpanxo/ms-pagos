server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ms-pagos
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pagos_db}
    username: ${SPRING_DATASOURCE_USERNAME:pagos}
    password: ${SPRING_DATASOURCE_PASSWORD:pagos_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          tenant-id: ${AZURE_TENANT_ID}
          client-id: ${AZURE_CLIENT_ID}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

services:
  ordenes:
    url: ${ORDENES_SERVICE_URL:http://localhost:8084/api/v1/ordenes}

transbank:
  commerce-code: ${TRANSBANK_COMMERCE_CODE:597055555532}
  api-key: ${TRANSBANK_API_KEY:}
  environment: ${TRANSBANK_ENVIRONMENT:integration}
  return-url: ${TRANSBANK_RETURN_URL:http://localhost:8083/api/pagos/retorno}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

fraud:
  max-attempts: ${FRAUD_MAX_ATTEMPTS:3}
  window-seconds: ${FRAUD_WINDOW_SECONDS:10}
  block-minutes: ${FRAUD_BLOCK_MINUTES:30}

pedidos360:
  exchange: ${RABBITMQ_EXCHANGE:pedidos360.exchange}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
