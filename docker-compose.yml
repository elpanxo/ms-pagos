services:
  pagos-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pagos_db
      POSTGRES_USER: pagos
      POSTGRES_PASSWORD: pagos_local
    ports:
      - "5433:5432"
    volumes:
      - pagos-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagos -d pagos_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  ms-pagos:
    build: .
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://pagos-db:5432/pagos_db
      SPRING_DATASOURCE_USERNAME: pagos
      SPRING_DATASOURCE_PASSWORD: pagos_local
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      ORDENES_SERVICE_URL: ${ORDENES_SERVICE_URL:-http://host.docker.internal:8084/api/v1/ordenes}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      TRANSBANK_COMMERCE_CODE: ${TRANSBANK_COMMERCE_CODE:-597055555532}
      TRANSBANK_API_KEY: ${TRANSBANK_API_KEY:-}
      TRANSBANK_ENVIRONMENT: ${TRANSBANK_ENVIRONMENT:-integration}
      TRANSBANK_RETURN_URL: ${TRANSBANK_RETURN_URL:-http://localhost:8083/api/pagos/retorno}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${SPRING_KAFKA_CONSUMER_GROUP_ID:-payment-velocity-group}
      PAYMENT_ATTEMPTS_TOPIC: ${PAYMENT_ATTEMPTS_TOPIC:-payment-attempts}
      PAYMENT_ATTEMPTS_PARTITIONS: ${PAYMENT_ATTEMPTS_PARTITIONS:-3}
      PAYMENT_ATTEMPTS_REPLICAS: ${PAYMENT_ATTEMPTS_REPLICAS:-1}
    depends_on:
      pagos-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_healthy

volumes:
  pagos-db-data:
